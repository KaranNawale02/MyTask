name: Auto Create PR to Automation

on:
  push:
    branches-ignore:
      - main

permissions:
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Pull Request
        run: |
          gh pr create --base automation --title "Auto PR from ${{ github.ref_name }}" --body "Auto PR created by GitHub Actions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}