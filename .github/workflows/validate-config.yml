name: Validate Configuration Files

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cfgfiles/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies (if any)
      run: |
        python -m pip install --upgrade pip
        # Add any necessary dependencies here
        # pip install ...

    - name: Run validation script
      run: |
        python utils/ucheck_cfg_params.py --input_files "$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep 'configfiles/' | tr '\n' ',' | sed 's/,$//')" --default_file "test_data/expected.cfg"
      shell: bash

    - name: Check for script errors
      if: ${{ failure() }}
      run: echo "Validation failed."